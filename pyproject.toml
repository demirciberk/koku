[project]
name = "koku"
version = "0.1.0"
description = "Turkish fragrance assistant: distilled small LM, fine-tuned retriever, in-browser demo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "matplotlib>=3.9",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
